name: Qoder 每日自动领取

# ─────────────────────────────────────────────────────────────
#  Qoder CN「每天领 100 Credits」· GitHub Actions 版
#  原理：读仓库 Secret 里的凭据，直接调官方活动平台接口
#       （接口直签，不用开客户端、不用本机常驻）
#
#  账号体系沿用 WorkBuddy 签到同一套做法：
#
#  ① 固定 job（仓库级 Secret，单账号 Fork 直接可用）
#    主账号 → QODER_ACCESS_TOKEN / QODER_REFRESH_TOKEN / QODER_UID
#
#  ② 动态 job（Environment 级 Secret，用于「随便再加账号」）
#    仓库变量 QODER_ACCOUNTS 里列出的账号编号（逗号分隔，如 "8f2f291a,1234abcd"），
#    每个编号对应一个 Environment `qoder-<编号>`，环境内存放与仓库级**同名**的
#    QODER_ACCESS_TOKEN / QODER_REFRESH_TOKEN / QODER_UID。
#    job 通过 `environment: qoder-<编号>` 取用，环境级 Secret 覆盖仓库级同名值，
#    因此各账号互不干扰。新增账号只需在本机 AiRoute 登录该号后跑一次同步工具：
#    工具自动建 Environment、写令牌、把编号追加进 QODER_ACCOUNTS，
#    不需要改本文件、也不需要去网页手动加 Secret。
#
#  ⚠️ 一个必须知道的官方限制（不是本项目的 bug）：
#     Qoder 的活动平台按「人」去重 —— 同一台机器/同一个人名下多个账号，
#     当天只有第一个能领到，其余会返回 SAME_PERSON_ALREADY_CLAIMED。
#     所以多账号能不能叠加，取决于这些账号是不是被判定为不同的人。
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC。Qoder 领取窗口 =「今天 10:00 → 明天 10:00」。
    #
    # 主班：北京 07:00（= UTC 23:00 前一天）
    #   GitHub cron 常延迟 3~7.5 小时，落点大概率在 10:00 之后，届时直接领取。
    #   若几乎没延迟、7 点准点跑，窗口还没开：脚本报「新一轮未开放」并退出 10，
    #   Actions 显示绿色、不推手机，由 qoder-watchdog.yml 在 10:05 起每 15 分钟
    #   只读巡检、确认主班跑完仍没领到时再 dispatch 本 workflow 补跑。
    #   ⚠️ 巡检不直接 claim，靠本 workflow 的 concurrency 串行，不会撞风控。
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅查询状态，不执行领取'
        required: false
        default: false
        type: boolean
      reason:
        description: '触发来源（watchdog 补跑时填 watchdog，仅用于日志区分）'
        required: false
        default: ''
        type: string

concurrency:
  group: qoder-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 读取动态账号列表，生成 matrix ──────────────────────────
  prepare_accounts:
    name: 读取账号列表
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: 生成动态 matrix
        id: build
        env:
          LIST: ${{ vars.QODER_ACCOUNTS }}
        run: |
          items=""
          n=0
          for t in $(printf '%s' "$LIST" | tr ',' ' '); do
            # 只接受 4~16 位十六进制/字母数字编号，其余（空项、说明文字）忽略
            case "$t" in ''|*[!0-9a-zA-Z]*) continue ;; esac
            [ "${#t}" -ge 4 ] || continue
            [ "${#t}" -le 16 ] || continue
            [ -z "$items" ] || items="$items,"
            items="$items{\"slot\":\"$t\",\"env\":\"qoder-$t\",\"seq\":$n}"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo 'matrix={"include":[{"slot":"none","env":"none","seq":0}]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$items]}" >> "$GITHUB_OUTPUT"
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "动态账号数：$n"

  # ── 主账号（仓库级 Secret） ────────────────────────────────
  checkin_main:
    name: 执行领取 · 主账号
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      exit_code: ${{ steps.checkin.outputs.exit_code }}
    steps:

      # 主账号先领、不额外等待；第二个号由 checkin_dynamic 的
      # needs: checkin_main + sleep 300 保证在它之后整 5 分钟才 claim。
      - uses: actions/checkout@v4

      - name: 检查凭据
        id: guard
        env:
          T: ${{ secrets.QODER_ACCESS_TOKEN }}
          R: ${{ secrets.QODER_REFRESH_TOKEN }}
        run: |
          if [ -n "$T" ] || [ -n "$R" ]; then
            echo "✓ 凭据已配置（内容不外显）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::未配置凭据。请在 Settings → Secrets and variables → Actions 添加 QODER_ACCESS_TOKEN（或 QODER_REFRESH_TOKEN）。"
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: 执行领取
        id: checkin
        if: steps.guard.outputs.skip != 'true'
        env:
          QODER_ACCESS_TOKEN: ${{ secrets.QODER_ACCESS_TOKEN }}
          QODER_REFRESH_TOKEN: ${{ secrets.QODER_REFRESH_TOKEN }}
          QODER_UID: ${{ secrets.QODER_UID }}
          QODER_MACHINE_ID: ${{ secrets.QODER_MACHINE_ID }}
          WECOM_APP: ${{ secrets.WECOM_APP }}
          QODER_ACCOUNT_LABEL: ${{ vars.QODER_LABEL || 'Qoder 主账号' }}
          QODER_CHECK_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.check_only) && '1' || '0' }}
        run: |
          # 管道会吞掉退出码，用 PIPESTATUS 精确取 Python 的退出码
          set +e
          python checkin.py | tee run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # 10 = 窗口还没开（北京时间 10:00 前）。这不算失败、也不推手机；
          # 由 qoder-watchdog.yml 巡检后按需补跑。
          if [ "$rc" = "10" ]; then
            echo "::notice::当前还没到 10:00 领取窗口，本次未领取；状态巡检会在 10:05 起接手。"
            exit 0
          fi
          exit $rc

      - name: 运行摘要
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        run: |
          echo "### Qoder 领取结果" >> "$GITHUB_STEP_SUMMARY"
          python summarize.py result.json >> "$GITHUB_STEP_SUMMARY"

      # 每日积分播报数据源：把本账号的积分/到期日交给汇总 job。
      # if: always() 保证签到失败时也上传（失败账号会在播报里明确标出）。
      - name: 上传积分数据供跨账号播报
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qoder-expiry-main
          path: result.json
          if-no-files-found: ignore
          retention-days: 3

      - name: 失败时终止任务
        if: ${{ steps.guard.outputs.skip != 'true' && steps.checkin.outcome != 'success' }}
        run: |
          echo "::error::Qoder 领取未成功（退出码 ${{ steps.checkin.outputs.exit_code }}），请查看上方日志"
          exit 1

  # ── 动态账号（Environment 级 Secret） ─────────────────────
  checkin_dynamic:
    name: 执行领取 · ${{ matrix.slot }}
    needs: [prepare_accounts, checkin_main]
    if: ${{ !cancelled() && needs.prepare_accounts.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1        # 串行：上游对连续 claim 有频率判据
      matrix: ${{ fromJSON(needs.prepare_accounts.outputs.matrix) }}
    environment: ${{ matrix.env }}
    steps:

      # ── 账号间隔 5 分钟 ──────────────────────────────────
      # needs: checkin_main 保证本 job 一定在主账号之后启动；这里再等 300 秒，
      # 使两次 claim 之间约 5 分钟（多账号时 max-parallel:1 依次递推）。
      - name: 账号间隔 300 秒
        run: |
          echo "等待 300 秒，与上一个账号的 claim 拉开 5 分钟"
          sleep 300
      - uses: actions/checkout@v4

      - name: 检查凭据
        id: guard
        env:
          T: ${{ secrets.QODER_ACCESS_TOKEN }}
          R: ${{ secrets.QODER_REFRESH_TOKEN }}
        run: |
          if [ -n "$T" ] || [ -n "$R" ]; then
            echo "✓ 凭据已配置（内容不外显）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Environment「${{ matrix.env }}」没有凭据，跳过该账号"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: 执行领取
        id: checkin
        if: steps.guard.outputs.skip != 'true'
        env:
          QODER_ACCESS_TOKEN: ${{ secrets.QODER_ACCESS_TOKEN }}
          QODER_REFRESH_TOKEN: ${{ secrets.QODER_REFRESH_TOKEN }}
          QODER_UID: ${{ secrets.QODER_UID }}
          QODER_MACHINE_ID: ${{ secrets.QODER_MACHINE_ID }}
          WECOM_APP: ${{ secrets.WECOM_APP }}
          QODER_ACCOUNT_LABEL: ${{ matrix.slot }}
          QODER_CHECK_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.check_only) && '1' || '0' }}
        run: |
          set +e
          python checkin.py | tee run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "10" ]; then
            echo "::notice::${{ matrix.slot }} 还没到 10:00 领取窗口，本次未领取；状态巡检会在 10:05 起接手。"
            exit 0
          fi
          exit $rc

      - name: 运行摘要
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        run: |
          echo "### Qoder 领取结果 · ${{ matrix.slot }}" >> "$GITHUB_STEP_SUMMARY"
          python summarize.py result.json >> "$GITHUB_STEP_SUMMARY"

      - name: 上传积分数据供跨账号播报
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qoder-expiry-${{ matrix.slot }}
          path: result.json
          if-no-files-found: ignore
          retention-days: 3

      - name: 失败时终止任务
        if: ${{ steps.guard.outputs.skip != 'true' && steps.checkin.outcome != 'success' }}
        run: |
          echo "::error::${{ matrix.slot }} 领取未成功（退出码 ${{ steps.checkin.outputs.exit_code }}）"
          exit 1

  # ── 每日积分播报：签到完成后汇总所有账号，推一条到手机 ──────────
  # 独立于 heartbeat：即使某个账号失败也照常播报（失败账号明确标出），
  # 且播报失败不影响签到结果与心跳上报。RECOMMEND_NOTIFY=0 可整体关闭。
  # 窗口未开（exit_code=10）时整条跳过 —— 时间没到不推手机，等巡检补跑后
  # 由补跑那次 run 统一播报，避免早上收到一条「积分没变」的无效消息。
  daily_report:
    name: 每日积分播报
    needs: [checkin_main, checkin_dynamic]
    if: ${{ always() && !cancelled() && needs.checkin_main.outputs.exit_code != '10' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      WECOM_APP: ${{ secrets.WECOM_APP }}
      RECOMMEND_NOTIFY: ${{ vars.RECOMMEND_NOTIFY }}
      REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载各账号积分数据
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: qoder-expiry-*
          path: _report

      - name: 汇总积分并推送每日播报
        run: |
          python daily_report.py _report --title Qoder | tee _daily.md
          cat _daily.md >> "$GITHUB_STEP_SUMMARY"

  # ── 心跳上报（自动心跳监测注入，勿删）──────────────────────
  heartbeat:
    name: 上报成功心跳
    needs: [prepare_accounts, checkin_main, checkin_dynamic]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Healthchecks
        run: |
          U="${{ vars.HC_PING_URL }}"
          if [ -z "$U" ]; then echo "[心跳] 未配置 HC_PING_URL，跳过"; exit 0; fi
          if curl -fsS --max-time 15 --retry 2 "$U"; then echo "[心跳] 已上报成功"; fi
